<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zentra</title>
<meta name="description" content="A pixel-art story game about the machines humanity left behind on the Moon and Mars. Find them, fix them, remember them.">
<meta name="theme-color" content="#070812">
<meta property="og:type" content="website">
<meta property="og:title" content="Zentra">
<meta property="og:description" content="The old machines are still out there. Someone has to go find them.">
<meta property="og:image" content="https://oocaprisun.github.io/zentra/share.jpg">
<meta property="og:url" content="https://oocaprisun.github.io/zentra/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/Bungee-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/PixelifySans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/cards.css">
<link rel="stylesheet" href="src/achievements.css">
<link rel="stylesheet" href="src/garage.css">
</head>
<body>
<div id="stage">
  <div id="cam"><img id="bg" alt=""><div id="actors"></div></div>
  <div id="fx"></div>
  <div class="bar top"></div><div class="bar bottom"></div>
  <div id="stamp"></div>
  <div id="dialog" hidden><p id="text"><span id="who"></span><span id="words"></span><span id="next" aria-hidden="true">▼</span></p></div>
  <div id="puzzle" hidden></div>
  <div id="fade"></div>
  <button id="skip" title="Skip scene">Skip scene</button>
  <div id="start">
    <canvas id="orrery" width="480" height="270" aria-hidden="true"></canvas>
    <div class="menu">
      <h1>ZENTRA</h1>
      <p>The old machines are still out there. Someone has to go find them.</p>
      <div class="menu-actions">
        <button id="resume-game" hidden>Resume mission</button>
        <small id="resume-where" hidden></small>
        <button id="go">Start the mission</button>
      </div>
      <small class="menu-help">Space, Enter or click to continue dialogue. Esc pauses.</small>
    </div>
  </div>
</div>
<script src="src/persist.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
